<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>VVPAT Prototype 2</title><link rel="stylesheet" href="/css/output.css"><link href="https://fonts.googleapis.com/css2?family=Hind+Madurai:wght@400;500;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet"><style>@keyframes print{from{height:0;opacity:0}to{height:224px;opacity:1}}@keyframes stamp{from{opacity:0;transform:rotate(-15deg) scale(2)}to{opacity:1;transform:rotate(-15deg) scale(1)}}@keyframes drop{0%,35%{transform:rotateX(0);opacity:1}100%{transform:rotateX(80deg) translateY(230px);opacity:0}}.slip{animation:print 2s ease-out both}.stamp{animation:stamp .5s ease-out both}.drop{animation:drop 1.5s ease-in both}</style></head><body class="min-h-screen bg-slate-950 font-[Hind_Madurai] text-white"><main class="mx-auto flex min-h-screen max-w-4xl flex-col items-center justify-center px-4 py-10"><p class="font-mono text-xs tracking-[.25em] text-amber-300">STUDENT COUNCIL ELECTION</p><h1 class="mt-2 text-3xl font-bold">Voter Verifiable Paper Audit Trail</h1><section class="mt-7 w-full max-w-lg rounded-3xl border-[8px] border-[#6c8688] bg-[#b5d7d8] p-5 shadow-[0_28px_70px_rgba(0,0,0,.5)]"><div class="flex items-center justify-between border-b-2 border-[#6c8688] pb-3 font-mono text-xs text-slate-800"><span>VVPAT UNIT</span><span>READY</span></div><div class="mt-4 h-72 overflow-hidden rounded-xl border-8 border-slate-800 bg-slate-900 p-4"><article id="slip" class="slip relative overflow-hidden bg-[#fffdf7] px-6 py-5 text-slate-900 shadow-xl"><p class="font-mono text-xs text-slate-500">ELECTION COMMISSION - DEMO</p><div class="my-5 border-y-2 border-dotted border-slate-400 py-4"><p class="text-sm text-slate-500">You voted for</p><p id="party" class="mt-1 text-2xl font-bold">Common Off Janata Party</p></div><p class="font-mono text-xs text-slate-500">PLEASE VERIFY YOUR SLIP</p><span id="stamp" class="absolute inset-0 grid place-items-center font-mono text-5xl font-bold text-emerald-600 opacity-0">VOTED</span></article></div></section><p id="status" class="mt-5 text-center text-slate-300">The slip is visible for your verification.</p><div id="actions" class="mt-5 flex gap-3"><button id="edit" class="rounded-lg border border-slate-500 px-5 py-3 font-semibold hover:bg-slate-800">Edit Selection</button><button id="confirm" class="rounded-lg bg-emerald-500 px-6 py-3 font-bold text-emerald-950 hover:bg-emerald-400">Confirm</button></div></main><script src="https://cdn.tailwindcss.com"></script><script>const party=new URLSearchParams(location.search).get('party');if(party)document.getElementById('party').textContent=party;const slip=document.getElementById('slip'),stamp=document.getElementById('stamp'),actions=document.getElementById('actions'),status=document.getElementById('status');document.getElementById('edit').onclick=()=>location.href='/';document.getElementById('confirm').onclick=()=>{actions.hidden=true;status.textContent='Vote confirmed. Securing your paper slip...';stamp.classList.remove('opacity-0');stamp.classList.add('stamp');setTimeout(()=>slip.classList.add('drop'),650);setTimeout(()=>location.href='/confirmedVote',2650)};</script></body></html>
