<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>VVPAT Prototype 4</title><link rel="stylesheet" href="/css/output.css"><link href="https://fonts.googleapis.com/css2?family=Hind+Madurai:wght@400;500;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet"><style>@keyframes print{from{clip-path:inset(0 0 100%);transform:translateY(-45px)}to{clip-path:inset(0);transform:translateY(0)}}@keyframes stamp{from{opacity:0;transform:rotate(-20deg) scale(2.8)}to{opacity:1;transform:rotate(-20deg) scale(1)}}@keyframes drop{0%,40%{transform:translateY(0) rotateX(0);opacity:1}100%{transform:translateY(245px) rotateX(82deg);opacity:0}}.slip{animation:print 2s ease-out both}.stamp{animation:stamp .55s cubic-bezier(.2,.8,.2,1) both}.drop{animation:drop 1.55s ease-in both}</style></head><body class="min-h-screen bg-[#f5f0e7] font-[Hind_Madurai] text-slate-900"><main class="mx-auto flex min-h-screen max-w-xl flex-col items-center justify-center px-4 py-10"><header class="mb-6 text-center"><p class="font-mono text-xs font-bold tracking-[.22em] text-orange-700">CAMPUS DEMOCRACY - VVPAT</p><h1 class="mt-2 text-3xl font-bold">Verify your selection</h1><p class="mt-2 text-slate-600">Your paper slip is visible briefly before it drops into the secure box.</p></header><div class="w-full rounded-3xl bg-white p-6 shadow-xl"><section class="rounded-2xl border-[7px] border-[#769294] bg-[#b9dddd] p-4"><div class="flex justify-between font-mono text-xs font-bold text-slate-700"><span>VVPAT UNIT</span><span>SECURE</span></div><div class="mt-3 h-64 overflow-hidden rounded-lg border-8 border-slate-800 bg-slate-950 p-4"><article id="slip" class="slip relative min-h-48 bg-[#fffcf3] px-5 py-5 text-slate-900 shadow-xl"><p class="font-mono text-xs text-slate-500">VVPAT VOTE SLIP</p><div class="my-5 border-y border-dashed border-slate-300 py-4"><p class="text-sm text-slate-500">Your selected party</p><p id="party" class="mt-1 text-2xl font-bold leading-tight">Common Off Janata Party</p></div><p class="font-mono text-xs text-slate-500">PRINTED FOR VERIFICATION</p><span id="stamp" class="absolute inset-0 grid place-items-center font-mono text-5xl font-bold text-emerald-600 opacity-0">VOTED</span></article></div></section><p id="status" class="mt-5 text-center text-sm font-bold text-slate-700">Please verify the slip before confirming.</p><div id="actions" class="mt-5 grid grid-cols-2 gap-3"><button id="edit" class="rounded-xl border-2 border-slate-300 px-4 py-3 font-semibold">Edit Selection</button><button id="confirm" class="rounded-xl bg-emerald-700 px-4 py-3 font-bold text-white">Confirm</button></div></div></main><script src="https://cdn.tailwindcss.com"></script><script>const party=new URLSearchParams(location.search).get('party');if(party)document.getElementById('party').textContent=party;const slip=document.getElementById('slip'),stamp=document.getElementById('stamp'),actions=document.getElementById('actions'),status=document.getElementById('status');document.getElementById('edit').onclick=()=>location.href='/';document.getElementById('confirm').onclick=()=>{actions.hidden=true;status.textContent='Confirmed. Securing your VVPAT slip...';stamp.classList.remove('opacity-0');stamp.classList.add('stamp');setTimeout(()=>slip.classList.add('drop'),700);setTimeout(()=>location.href='/confirmedVote',2700)};</script></body></html>
