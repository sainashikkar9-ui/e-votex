<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>VVPAT Prototype 1</title><link rel="stylesheet" href="/css/output.css"><link href="https://fonts.googleapis.com/css2?family=Hind+Madurai:wght@400;500;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet"><style>
@keyframes print{from{clip-path:inset(0 0 100% 0);transform:translateY(-14px)}to{clip-path:inset(0);transform:translateY(0)}}@keyframes stamp{0%{opacity:0;transform:rotate(-18deg) scale(2.4)}65%{opacity:1;transform:rotate(-18deg) scale(.92)}100%{opacity:1;transform:rotate(-18deg) scale(1)}}@keyframes foldDrop{0%,36%{transform:perspective(560px) rotateX(0) translateY(0);opacity:1}60%{transform:perspective(560px) rotateX(75deg) translateY(15px)}100%{transform:perspective(560px) rotateX(88deg) translateY(220px);opacity:0}}.print{animation:print 2s ease-out both}.stamp{animation:stamp .65s ease-out both}.drop{animation:foldDrop 1.65s cubic-bezier(.2,.8,.25,1) both}
</style></head><body class="min-h-screen bg-[#f5f0e7] font-[Hind_Madurai] text-slate-900"><main class="mx-auto flex min-h-screen max-w-5xl flex-col items-center justify-center gap-7 px-4 py-10"><header class="text-center"><p class="font-mono text-xs font-bold tracking-[.22em] text-orange-700">CAMPUS DEMOCRACY - VVPAT</p><h1 class="mt-2 text-3xl font-bold">Verify your selection</h1><p class="mt-2 text-slate-600">Your paper slip is visible briefly before it drops into the secure box.</p></header><section class="w-full max-w-md rounded-[2rem] border-[9px] border-[#5d7172] bg-[#9fcacc] p-4 shadow-2xl"><div class="rounded-[1.25rem] border-2 border-[#84afb1] bg-[#dff5f5] p-4"><div class="mb-4 flex justify-between font-mono text-xs font-bold text-slate-700"><span>VVPAT</span><span>GPP-01</span></div><div class="relative h-72 overflow-hidden rounded-lg border-[9px] border-slate-800 bg-slate-950 p-4"><div class="absolute inset-x-5 bottom-0 h-8 rounded-t bg-slate-700"></div><article id="slip" class="print relative z-10 min-h-52 bg-white px-5 py-6 text-slate-900 shadow-xl"><p class="font-mono text-xs text-slate-500">VVPAT VOTE SLIP</p><div class="my-5 border-y border-dashed border-slate-300 py-4"><p class="text-sm text-slate-500">Your selected party</p><p id="party" class="mt-1 text-2xl font-bold leading-tight">Common Off Janata Party</p></div><p class="font-mono text-xs text-slate-500">PRINTED FOR VERIFICATION</p><span id="stamp" class="pointer-events-none absolute inset-0 grid place-items-center font-mono text-4xl font-bold tracking-widest text-emerald-600 opacity-0">VOTED</span></article></div></div></section><div id="actions" class="flex flex-wrap justify-center gap-3"><button id="edit" class="rounded-xl border-2 border-slate-400 bg-white px-5 py-3 font-semibold hover:bg-slate-100">Edit Selection</button><button id="confirm" class="rounded-xl bg-emerald-700 px-6 py-3 font-bold text-white shadow-lg hover:bg-emerald-800">Confirm</button></div><p id="status" class="text-center text-sm font-medium text-slate-600" aria-live="polite">Please verify the slip before confirming.</p></main><script src="https://cdn.tailwindcss.com"></script><script>
const party=new URLSearchParams(location.search).get('party');if(party)document.getElementById('party').textContent=party;const slip=document.getElementById('slip'),stamp=document.getElementById('stamp'),actions=document.getElementById('actions'),status=document.getElementById('status');document.getElementById('edit').onclick=()=>location.href='/';document.getElementById('confirm').onclick=()=>{actions.hidden=true;status.textContent='Vote confirmed. Securing your paper slip...';stamp.classList.remove('opacity-0');stamp.classList.add('stamp');setTimeout(()=>slip.classList.add('drop'),700);setTimeout(()=>location.href='/confirmedVote',2700)};
</script></body></html>
